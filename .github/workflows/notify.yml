name: Release and Notify

on:
  push:
    tags:
      - 'v*'

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract and Format Changelog
        id: changelog
        run: |
          awk -v tag="## [${{ github.ref_name }}]" 'index($0, tag) == 1 { p=1; next } p && /^## \[v/ { exit } p' docs/CHANGELOG.md > raw.txt
          sed -i 's/`//g; s/\*\*//g; /^---$/d' raw.txt
          sed -i 's/### Добавлено/\n📦 ДОБАВЛЕНО:/g' raw.txt
          sed -i 's/### Изменено/\n🔄 ИЗМЕНЕНО:/g' raw.txt
          sed -i 's/### Исправлено/\n🛠 ИСПРАВЛЕНО:/g' raw.txt
          sed -i 's/### Оптимизировано/\n⚡ ОПТИМИЗИРОВАНО:/g' raw.txt
          sed -i '/./,$!d' raw.txt
          sed -i -e :a -e '/^\n*$/{$d;N;ba' -e '}' raw.txt
          cat -s raw.txt > final_changelog.txt
          head -c 3000 final_changelog.txt > latest_changelog.txt
          sed 's/</\&lt;/g; s/>/\&gt;/g' latest_changelog.txt > latest_changelog_tg.txt

          echo "BODY<<EOF" >> $GITHUB_OUTPUT
          cat latest_changelog.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.BODY }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send to Telegram
        if: ${{ !contains(github.ref_name, 'test') }}
        run: |
          MESSAGE=$(printf "🚀 Вышел новый релиз Nexus %s!\n\n📦 Что нового и ссылки на скачивание читайте на моем сайте:\nhttps://1maniak.github.io/nexus/\n\n👤 Автор: https://github.com/${{ github.actor }}\n💻 Исходный код: https://github.com/${{ github.repository }}" "${{ github.ref_name }}")
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            --data-urlencode "text=$MESSAGE"

      - name: Send to VK wall
        if: ${{ !contains(github.ref_name, 'test') }}
        run: |
          MESSAGE=$(printf "🚀 Вышел новый релиз Nexus %s!\n\n📦 Что нового и ссылки на скачивание читайте на моем сайте:\nhttps://1maniak.github.io/nexus/\n\n👤 Автор: https://github.com/${{ github.actor }}\n💻 Исходный код: https://github.com/${{ github.repository }}" "${{ github.ref_name }}")
          curl -s -X POST "https://api.vk.com/method/wall.post" \
            -d access_token="${{ secrets.VK_ACCESS_TOKEN }}" \
            -d owner_id="${{ secrets.VK_GROUP_ID }}" \
            -d from_group=1 \
            -d v=5.131 \
            --data-urlencode "message=$MESSAGE"