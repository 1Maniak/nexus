name: Notify about new release

on:
  push:
    tags:
      - 'v*'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract latest changelog
        run: |
          # Извлекаем первую запись о версии (от первого заголовка до второго)
          awk '/^## \ [v/{if (p) exit; p=1; next} p' docs/CHANGELOG.md > latest_changelog.txt

      - name: Send to Telegram
        run: |
          CHANGELOG=$(cat latest_changelog.txt)
          MESSAGE=$(printf "Новый релиз Nexus!\n\nТег: %s\n\nЧто нового:\n%s\n\nАвтор: %s\nРепозиторий: %s" "${{ github.ref_name }}" "$CHANGELOG" "${{ github.actor }}" "${{ github.repository }}")
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=$MESSAGE"

      - name: Send to VK wall
        run: |
          CHANGELOG=$(cat latest_changelog.txt)
          MESSAGE=$(printf "Новый релиз Nexus!\n\nТег: %s\n\nЧто нового:\n%s\n\nАвтор: %s\nРепозиторий: %s" "${{ github.ref_name }}" "$CHANGELOG" "${{ github.actor }}" "${{ github.repository }}")
          curl -s -X POST "https://api.vk.com/method/wall.post" \
            -d access_token="${{ secrets.VK_ACCESS_TOKEN }}" \
            -d owner_id="${{ secrets.VK_GROUP_ID }}" \
            --data-urlencode "message=$MESSAGE" \
            -d v=5.131