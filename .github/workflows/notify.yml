name: Notify about new release

on:
  push:
    tags:
      - 'v*'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract latest changelog
        run: |
          # Берем текст от первого ## [v до следующего ## и убираем последнюю строчку
          sed -n '/^## \[v/,/^## /p' docs/CHANGELOG.md | head -n -1 > raw_changelog.txt
          
          # Убираем технические символы markdown (** и ###), чтобы текст выглядел чисто
          sed -i 's/\*\*//g; s/###/  - /g; s/##//g' raw_changelog.txt
          
          # Обрезаем текст до 3500 символов (чтобы точно влезло в Telegram)
          head -c 3500 raw_changelog.txt > latest_changelog.txt
          
          echo "--- ТЕКСТ, КОТОРЫЙ УЙДЕТ В МЕССЕНДЖЕРЫ ---"
          cat latest_changelog.txt
          echo "-------------------------------------------"

      - name: Send to Telegram
        run: |
          CHANGELOG=$(cat latest_changelog.txt)
          MESSAGE=$(printf "🚀 Новый релиз Nexus!\n\n🏷 Тег: %s\n\n📝 Что нового:\n%s\n\n👤 Автор: %s\n🔗 Репо: %s" "${{ github.ref_name }}" "$CHANGELOG" "${{ github.actor }}" "${{ github.repository }}")
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=$MESSAGE"

      - name: Send to VK wall
        run: |
          CHANGELOG=$(cat latest_changelog.txt)
          MESSAGE=$(printf "🚀 Новый релиз Nexus!\n\n🏷 Тег: %s\n\n📝 Что нового:\n%s\n\n👤 Автор: %s\n🔗 Репо: %s" "${{ github.ref_name }}" "$CHANGELOG" "${{ github.actor }}" "${{ github.repository }}")
          curl -s -X POST "https://api.vk.com/method/wall.post" \
            -d access_token="${{ secrets.VK_ACCESS_TOKEN }}" \
            -d owner_id="${{ secrets.VK_GROUP_ID }}" \
            --data-urlencode "message=$MESSAGE" \
            -d from_group=1 \
            -d v=5.131